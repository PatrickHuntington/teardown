name: Validate bundle

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify original files and local references
        run: python maintenance/verify_bundle.py
      - name: Check helpers without downloads
        run: python tests/check_helpers.py
      - name: Build and verify portable ZIP
        run: python maintenance/package.py
